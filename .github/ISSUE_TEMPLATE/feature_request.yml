name: Feature request
description: Suggest an improvement to the StonkAgents CLI.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Features that are not specific to StonkAgents (new channels, agent behaviour, gateway features) are best proposed upstream in OpenClaw, where they benefit every fork. Link the upstream discussion here if one exists.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - StonkAgents provider plugin (extensions/stonkagents)
        - Installer / onboarding
        - Documentation
        - Shared OpenClaw behaviour (consider upstream)
        - Other
